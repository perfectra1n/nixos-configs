# Task runner for nixos-configs. `mise tasks` to list, `mise run <name>` to run.
# mise is installed by the flake + shell-hooked via chezmoi, so these autoload on `cd` here.
#
# Quiet the per-line `[task] $ …` command-echo (it printed every comment in long scripts like
# `apply`). `quiet` only drops mise's framing — task stdout/stderr (incl. our `>> …` progress
# and any errors) still prints. Override for one run with `mise run -o prefix <task>`.
[settings]
task_output = "quiet"

# ── Leak-gate tooling, ALSO pinned here (see .lefthook.toml) ───────────────────────────────
# These same three packages come from Nix (home/common.nix). This section is the ONE place in
# the repo where a binary reaches your PATH from outside the Nix store, and mise's install dir
# SHADOWS ~/.nix-profile/bin on PATH — so whatever is pinned here is what the leak gate actually
# executes, regardless of what the flake installed.
#
# That makes silent version drift the real hazard: Renovate's built-in mise manager bumps these,
# while nixpkgs moves on its own schedule via flake-inputs.txt. If they diverged, manifests/ would
# claim one gitleaks while a different one ran the gate.
#
# So the versions below MUST equal the nixpkgs ones, and that is ENFORCED, not merely intended:
# checks.x86_64-linux.mise-nixpkgs-versions in flake.nix parses this table with builtins.fromTOML,
# compares each pin to pkgs.<name>.version, and fails `nix flake check` (and therefore CI) on any
# mismatch. If a Renovate PR bumps one side, CI goes red until the other side catches up.
[tools]
lefthook = "2.1.12"
gitleaks = "8.30.1"
trufflehog = "3.97.1"
#
# What's automatable vs not:
#   - apply / verify / hardware / dirs / update     → fully scripted below.
#   - secrets:pull / secrets:pull-env               → refresh every Bitwarden-backed secret
#     (two manifests in scripts/secrets-sync.py) into BOTH channels — sops secrets.yaml and the
#     age-encrypted fish env vars: re-encrypt + commit. pull = both; pull-env = fish only.
#   - secrets:key-bootstrap                         → fresh-install: pull the one age key
#     from Bitwarden into sops-nix + chezmoi (single-key model, see .sops.yaml).
#   - secrets:init / secrets:edit / secrets:key-install → mise drives them, but YOU supply
#     the secret/decision (the token, the age key); editing secrets needs the key present.
# What's automatable vs not:
#   - apply / verify / hardware / dirs / update     → fully scripted below.
#   - secrets:pull / secrets:pull-env               → refresh every Bitwarden-backed secret
#     (two manifests in scripts/secrets-sync.py) into BOTH channels — sops secrets.yaml and the
#     age-encrypted fish env vars: re-encrypt + commit. pull = both; pull-env = fish only.
#   - secrets:key-bootstrap                         → fresh-install: pull the one age key
#     from Bitwarden into sops-nix + chezmoi (single-key model, see .sops.yaml).
#   - secrets:init / secrets:edit / secrets:key-install → mise drives them, but YOU supply
#     the secret/decision (the token, the age key); editing secrets needs the key present.

[tasks.apply]
description = "Rebuild a host (default: this one), then apply the in-repo dotfiles"
run = '''
set -eu
# Preflight: sops-nix decrypts at ACTIVATION, so its age key must exist BEFORE the
# rebuild — on a brand-new box it won't, and activation of any sops.secrets.* fails.
# Fetch it from Bitwarden first (secrets:key-bootstrap is a no-op if the key's already there).
if [ ! -e /var/lib/sops-nix/key.txt ]; then
  echo ">> no sops age key yet — fetching from Bitwarden first"
  mise run secrets:key-bootstrap
fi

# Auto-detected (root-UUID match → hostname). Override a specific config with HOST=desktop.
# host.sh prompts you to pick if it can't tell (fresh box's hostname is still "nixos").
host=$(./scripts/host.sh)
echo ">> host: $host"

# Preflight: a fresh box ships a PLACEHOLDER hardware-configuration.nix (fake disk UUIDs) —
# switching on that yields an UNBOOTABLE system. If this machine's real root UUID isn't in
# the host's hardware config, capture+commit it first. Skipped for any established host
# whose UUID already matches (normal day-to-day apply).
hw="hosts/$host/hardware-configuration.nix"
uuid=$(findmnt -no UUID / 2>/dev/null || true)
if [ -f "$hw" ] && [ -n "$uuid" ] && ! grep -qiF "$uuid" "$hw"; then
  echo ">> $hw isn't this machine yet — capturing hardware first"
  HOST="$host" mise run hardware
fi

# Preflight: secrets.yaml still the placeholder? Populate ALL Bitwarden-backed secrets
# (the git/* credential tokens, per the secrets-sync manifest) + commit BEFORE the switch — so
# this rebuild declares + decrypts them (modules/git-credentials.nix gates on lib/secrets.nix).
if grep -q "replace me with" secrets/secrets.yaml; then
  echo ">> secrets.yaml is the placeholder — initializing secrets from Bitwarden"
  mise run secrets:init
fi

# Preflight: did you add manifest rows (e.g. docker/*) that aren't in secrets.yaml yet? On an
# already-initialized box secrets:init is skipped above, so a NEW manifest key would never get
# pulled — and the modules gated on it (docker-credentials) would stay silently inert. This is a
# CHEAP LOCAL check (sops keeps keys in plaintext), so it only unlocks Bitwarden when something's
# genuinely missing — a normal day-to-day apply never prompts for the vault.
if ! grep -q "replace me with" secrets/secrets.yaml; then
  # `missing` = manifest rows absent from secrets.yaml. This was a while/read loop over a heredoc'd
  # manifest doing a `grep -qE "^[[:space:]]+$key:"` per key — which compared BARE keys and so
  # relied on them being unique across groups. The Python does a set difference on the
  # group-qualified paths instead, the same vocabulary lib/secrets.nix gates on.
  missing=$(./scripts/secrets-sync.py missing)
  if [ -n "$missing" ]; then
    echo ">> manifest keys not in secrets.yaml yet — $(echo "$missing" | tr '\n' ' ')— pulling from Bitwarden first"
    mise run secrets:pull
  fi
fi

sudo nixos-rebuild switch --flake ".#$host"

# Dotfiles now live in THIS repo under ./dotfiles — chezmoi reads them via ./.chezmoiroot, with
# sourceDir pinned to this checkout by modules/dotfiles.nix. No separate repo to clone/pull; the
# switch above already updated the source on disk. A missing age key degrades gracefully.
# NOTE: apply OVERWRITES local uncommitted edits under ./dotfiles — commit WIP first.
chezmoi apply || echo ">> apply failed — is the age key at ~/.config/age/age.agekey (mode 600)?"
'''

# Arm the leak gate (.lefthook.toml) with no command to remember. `enter` fires when mise
# activates for this directory — which it does on every `cd` here, since mise is shell-hooked
# via chezmoi — so a fresh clone installs its git hooks the moment you step into it. Costs ~0s
# once the hooks exist (measured: 0.00s warm), so running it on every `cd` is free.
#
# `postinstall` mirrors kopiur, and now that [tools] exists it's a live trigger: `mise install`
# on a fresh clone fetches lefthook and immediately arms the hooks. `enter` is still the stronger
# of the two — it needs no command at all — so both are kept; `lefthook install` is idempotent
# and free (measured 0.00s once the hooks exist), so the overlap costs nothing.
#
# Silent + fail-soft on purpose: before `mise install` (or a rebuild) lefthook isn't on PATH, and
# a hook that errored on every `cd` would be intolerable. `mise run hooks` reports properly.
# (A fresh clone's mise.toml is untrusted until `mise trust`, so this fires from that point on —
# but you must trust it to run any task here anyway.)
[hooks]
enter = "lefthook install >/dev/null 2>&1 || true"
postinstall = "lefthook install"

[tasks.hooks]
description = "Install the lefthook git hooks (the leak gate — see .lefthook.toml). Idempotent; the `enter` hook above does this automatically."
run = "lefthook install"

[tasks.verify]
description = "Eval the flake + every host + refresh manifests (run before committing)"
run = '''
set -eu
git add -A                               # flakes only see tracked files
# flake check forces config.system.build.toplevel.drvPath for EVERY nixosConfigurations entry, so
# this one command covers all hosts — the old `for h in $(ls hosts); do nix build --dry-run` loop
# was pure duplicate work (verified: it exits 1 on a bad option with no `checks` output at all).
# It also runs checks/ — the lib/secrets.nix unit tests.
#
# NO --no-build, deliberately. It sets Nix's readOnlyMode (`settings.readOnlyMode = !build`), which
# computes .drv paths WITHOUT writing them to the store — and that makes Import From Derivation
# impossible. Both graphical closures need IFD: trilium's pnpm2nix reads pnpm-lock.yaml through it
# (see the trilium input in flake.nix). So --no-build died with
#   error: path '<hash>-toJSON.drv' is not valid
# which reads like store corruption but is a config property. It only ever appeared to work while
# some earlier non-read-only eval had left that .drv in the store; `mise run gc` — or any fresh
# clone — brought it straight back. CI never hit this: check.yaml uses `nix build --dry-run`, which
# instantiates normally and so CAN do IFD.
# Price of dropping it: ~17s, and it realizes the two `touch $out` check markers (kept trivial for
# exactly this reason — see flake.nix) plus packages/*, whose shellcheck gate --no-build never
# actually ran.
nix flake check
# secrets-sync.py's selftest was wired into NOTHING and had silently rotted (it still asserted
# `set -Ux` long after merge_fishenv switched to `set -gx`). Run it here, in the choke-point every
# change flows through, so it can't rot again. It also asserts that yaml_paths agrees with
# lib/secrets.nix — i.e. that the ops tooling and the eval-time gate share one vocabulary.
./scripts/secrets-sync.py selftest
# Manifests ride the eval cache flake check just warmed, so this is cheap here.
# verify is the choke-point every change flows through (bump calls it too) — keeping the
# committed manifests in lockstep with the closure; CI fails if they drift (check.yaml).
nix run .#gen-manifests
git add manifests/
'''

[tasks.hardware]
description = "Capture THIS machine's hardware into hosts/<host>/ (auto-detect or prompt), then commit + push"
run = '''
set -eu
# Resolve which config this box is — auto-detected, or prompts you to pick (a fresh box's
# hostname is the installer default "nixos", which matches no config). Override: HOST=laptop.
host=$(./scripts/host.sh)
out="hosts/$host/hardware-configuration.nix"
echo ">> host: $host → $out"
sudo nixos-generate-config --show-hardware-config > "$out"

# Commit, not just stage: nixos-rebuild resolves this as a git+file:// flake, which only sees
# COMMITTED files (an uncommitted hardware-configuration.nix is invisible to the build).
# commit-push sets the author identity inline, so this works on a fresh box with no git config,
# and treats "nothing to commit" as success (re-capturing identical hardware is a normal no-op).
nix run .#commit-push -- "feat(hosts/$host): capture real hardware-configuration" "$out"
echo ">> done — now: mise run apply"
'''

# ── Secrets: the encrypted VALUES (sops secrets.yaml + the age-encrypted fish env file) ──
# Both Bitwarden→destination mappings live ONCE, in the two manifests at the top of
# scripts/secrets-sync.py (SOPS_MANIFEST + FISHENV_MANIFEST). Adding a Bitwarden-backed secret =
# one manifest line; secrets:pull / secrets:pull-env / secrets:init all use them.

[tasks."secrets:edit"]
description = "Edit the sops-encrypted secrets file (uses the secrets:key-bootstrap age identity)"
run = '''
set -eu
# sops' default key path is ~/.config/sops/age/keys.txt; the age identity lives at ~/.config/age/age.agekey.
export SOPS_AGE_KEY_FILE="$HOME/.config/age/age.agekey"
sops secrets/secrets.yaml
'''

[tasks."secrets:pull"]
description = "Refresh EVERY Bitwarden-backed secret — BOTH channels (sops secrets.yaml + the age-encrypted fish env vars) — in ONE vault unlock, then re-encrypt + commit. Run after rotating a token."
run = '''
set -eu
agekey="$HOME/.config/age/age.agekey"
[ -e "$agekey" ] || { echo ">> no age key at $agekey — run 'mise run secrets:key-bootstrap' first"; exit 1; }
# Refresh is a surgical `sops set` per key, so it needs an already-encrypted file. A fresh box
# whose secrets.yaml is still the shipped placeholder must be bootstrapped first.
grep -q "replace me with" secrets/secrets.yaml \
  && { echo ">> secrets.yaml is still the placeholder — run 'mise run secrets:init' first"; exit 1; }
export SOPS_AGE_KEY_FILE="$agekey"

# One source of truth: both manifests + all Bitwarden fetching live in the shared script.
# sync-all refreshes BOTH channels (sops + the fish env .age) with a SINGLE vault unlock.
./scripts/secrets-sync.py sync-all

# Commit both files together. A channel that was a no-op leaves its file unchanged and simply
# drops out of the commit; if BOTH are unchanged the `|| echo` makes this a clean exit 0.
fishage="dotfiles/dot_config/fish/fishconfig.d/encrypted_private_secrets.fish.age"
nix run .#commit-push -- "chore(secrets): refresh from Bitwarden" secrets/secrets.yaml "$fishage"
echo ">> secrets refreshed from Bitwarden (sops + fish env) + committed"
echo ">> new shells pick up the fish env automatically; for a shell that's ALREADY open run 'reload-secrets'"
echo ">> restart any app that reads these vars (MCP servers, editors) — its env froze at launch"
'''

[tasks."secrets:pull-env"]
description = "Refresh ONLY the fish env-var secrets (MCP tokens etc.) from Bitwarden into the age-encrypted secrets.fish — re-encrypt + commit. Use when you rotated an env secret but no sops secret."
run = '''
set -eu
agekey="$HOME/.config/age/age.agekey"
[ -e "$agekey" ] || { echo ">> no age key at $agekey — run 'mise run secrets:key-bootstrap' first"; exit 1; }
# This channel is chezmoi/age, not sops — no SOPS_AGE_KEY_FILE needed.
./scripts/secrets-sync.py fishenv

fishage="dotfiles/dot_config/fish/fishconfig.d/encrypted_private_secrets.fish.age"
nix run .#commit-push -- "chore(secrets): refresh fish env from Bitwarden" "$fishage"
echo ">> fish env secrets refreshed from Bitwarden + committed"
echo ">> new shells pick up the change automatically; for a shell that's ALREADY open run 'reload-secrets'"
echo ">> restart any app that reads these vars (MCP servers, editors) — its env froze at launch"
'''

[tasks."secrets:init"]
description = "One-time bootstrap: point .sops.yaml at the held age key, populate secrets.yaml from Bitwarden (the secrets-sync manifest) + commit"
run = '''
set -eu
agekey="$HOME/.config/age/age.agekey"
[ -e "$agekey" ] || { echo ">> no age key at $agekey — run 'mise run secrets:key-bootstrap' first"; exit 1; }
grep -q "replace me with" secrets/secrets.yaml \
  || { echo ">> secrets.yaml already initialized — refresh with 'mise run secrets:pull', edit with 'mise run secrets:edit'"; exit 0; }
export SOPS_AGE_KEY_FILE="$agekey"

# Encrypt to the key we actually hold: set .sops.yaml's &main recipient to this key's public
# half (replacing the placeholder), so sops encrypts secrets.yaml to a key we can decrypt.
pub=$(age-keygen -y "$agekey")
sed -i "s|&main age1[0-9A-Za-z]*|\&main $pub|" .sops.yaml

# Pull every manifest secret from Bitwarden as plaintext YAML, then sops-encrypt in place
# (values encrypted, keys stay readable). The SAME manifest secrets:pull refreshes later.
umask 077
./scripts/secrets-sync.py emit > secrets/secrets.yaml
sops --encrypt --in-place secrets/secrets.yaml

# Commit (git+file:// flake only sees committed files; and the secret must exist at eval).
nix run .#commit-push -- "feat(secrets): initialize from Bitwarden" .sops.yaml secrets/secrets.yaml
echo ">> secrets initialized + committed — rebuild to decrypt /run/secrets/*"
'''

[tasks."secrets:list"]
description = "List the secret keys in secrets.yaml, marking manifest-managed (secrets:pull) vs hand-set (secrets:edit). Read-only — no decryption."
# Was a hand-rolled YAML parser in POSIX sh: a `while read` loop with a `case` statement, a `sed -E`
# per line and an `awk` join, reconstructing structure from indentation. The same walk now lives
# once, in Python, next to the manifest it joins against — and mirrors lib/secrets.nix, which the
# Nix modules gate on. `mise run verify` asserts the two agree.
run = "./scripts/secrets-sync.py list"

[tasks."secrets:status"]
description = "Health check: both age keys present? secrets.yaml real? .sops.yaml recipient matches the key you hold? Read-only."
run = '''
set -u
ok()  { printf '  %-22s \033[32mok\033[0m %s\n' "$1" "${2:-}"; }
bad() { printf '  %-22s \033[31mMISSING\033[0m %s\n' "$1" "${2:-}"; }

sops_key="/var/lib/sops-nix/key.txt"
chezmoi_key="$HOME/.config/age/age.agekey"
[ -e "$sops_key" ]    && ok "age key (sops-nix)" "$sops_key"    || bad "age key (sops-nix)" "$sops_key"
[ -e "$chezmoi_key" ] && ok "age key (chezmoi)"  "$chezmoi_key" || bad "age key (chezmoi)"  "$chezmoi_key"

if grep -q "replace me with" secrets/secrets.yaml; then
  bad "secrets.yaml" "still the placeholder — run 'mise run secrets:init'"
else
  ok "secrets.yaml" "real (encrypted)"
fi

# Do we hold the key the secrets are encrypted to? Compare the held key's PUBLIC half to the
# &main recipient in .sops.yaml (age-keygen -y only derives the public half — no decryption).
if [ -e "$chezmoi_key" ]; then
  held=$(age-keygen -y "$chezmoi_key")
  want=$(grep -oE 'age1[0-9a-z]+' .sops.yaml | head -1)
  [ "$held" = "$want" ] && ok "recipient match" "$held" || bad "recipient match" "held=$held .sops.yaml=$want"
fi
'''

[tasks."secrets:get"]
description = "Decrypt + print ONE secret value to stdout: KEY=git/github_token mise run secrets:get"
run = '''
set -eu
: "${KEY:?usage: KEY=git/github_token mise run secrets:get}"
export SOPS_AGE_KEY_FILE="$HOME/.config/age/age.agekey"
grp=${KEY%%/*}; key=${KEY#*/}
sops --decrypt --extract "[\"$grp\"][\"$key\"]" secrets/secrets.yaml
'''

# ── Secrets: the age IDENTITY that decrypts the values (one key, both sops-nix + chezmoi) ──

[tasks."secrets:key-enroll"]
description = "Print this host's age recipient (add to .sops.yaml on a TRUSTED box, then mise run secrets:updatekeys)"
run = "ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub"

[tasks."secrets:key-install"]
description = "Install the chezmoi age identity from a path you supply (KEY=/path mise run secrets:key-install)"
run = '''
: "${KEY:?usage: KEY=/path/to/age.agekey mise run secrets:key-install}"
install -Dm600 "$KEY" "$HOME/.config/age/age.agekey"
echo ">> installed ~/.config/age/age.agekey"
'''

[tasks."secrets:key-bootstrap"]
description = "Fresh-install: pull the one age key from Bitwarden → sops-nix + chezmoi (BW_SERVER=url ITEM='AGE SOPS Key')"
# Was ~50 lines of Bitwarden auth state machine in shell (bw status | jq, conditional logout +
# config server, login vs unlock, bw get item | jq '.fields[]|select(...)', mktemp + trap +
# install ×2) — reimplementing bw_unlock/bwitem/field_of, which secrets-sync.py already had.
# Folding it in also means a fresh box unlocks the vault ONCE, not twice: the shell version ended
# with `bw lock`, and then secrets-sync.py immediately called bw_unlock() again. One prompt now.
# python3 is already a hard pre-rebuild dependency (apply calls secrets-sync.py a few lines below,
# still before nixos-rebuild), so this adds no new bootstrap requirement.
run = "./scripts/secrets-sync.py key-bootstrap"

[tasks.dirs]
description = "Create the dirs the Hyprland binds write to (screenshots)"
run = 'mkdir -p "$HOME/Pictures/Screenshots" "$HOME/Nextcloud/Photos/PC Screenshots"'

[tasks.update]
# Source dir is now this monorepo, so chezmoi's `git pull` pulls the whole repo (Nix + dotfiles)
# then applies the dotfiles — no rebuild. Pulled Nix changes just sit until the next `mise run apply`.
description = "Pull latest (whole monorepo) + apply dotfiles, without a system rebuild"
run = "chezmoi update"

[tasks.diff]
description = "Preview what a rebuild would change (closure diff vs the running system)"
run = '''
set -eu
host=$(./scripts/host.sh)
nixos-rebuild build --flake ".#$host"           # builds ./result, does NOT activate
nix store diff-closures /run/current-system ./result
'''

[tasks.manifests]
description = "Regenerate manifests/<host>.txt name-version inventories (all hosts, or HOST=desktop)"
run = '''
set -eu
nix run .#gen-manifests -- ${HOST:-}
git add manifests/
'''

[tasks.whatchanged]
description = "Package history across kept generations. No arg: version diffs per generation pair. PKG=<name>: where <name>'s STORE PATH changed — catches same-version rebuilds (the xdph case)"
run = '''
set -eu
nix run .#whatchanged -- ${PKG:-}
'''

[tasks.suspects]
description = "A bump broke <app> — which of its deps changed? BIN=flameshot [FROM=87 TO=88] — intersects the app's runtime closure with the generation diff + why-depends chains"
run = '''
set -eu
: "${BIN:?usage: BIN=<binary-or-path> [FROM=<gen> TO=<gen>] mise run suspects}"
nix run .#suspects -- "$BIN" "${FROM:-}" "${TO:-}"
'''

[tasks.dots-diff]
description = "Preview dotfile changes before apply overwrites anything"
run = "chezmoi diff"


[tasks.test]
description = "Apply now WITHOUT touching the bootloader (auto-reverts on reboot) — safe trials"
run = '''
set -eu
host=$(./scripts/host.sh)
sudo nixos-rebuild test --flake ".#$host"
'''

[tasks.hosts]
description = "List host configs in the repo + which one this machine resolves to"
run = '''
echo "host configs:"; ls -1 hosts
echo
echo "this machine → $(./scripts/host.sh)"
'''

[tasks.rollback]
description = "Switch back to the previous system generation"
run = "sudo nixos-rebuild switch --rollback"

[tasks.generations]
description = "List system generations + dates (rollback targets)"
run = "sudo nixos-rebuild list-generations"

[tasks.gc]
description = "Reclaim disk: delete generations >14d old, then dedup the store"
run = '''
set -eu
sudo nix-collect-garbage --delete-older-than 14d
sudo nix store optimise
'''

[tasks.bump]
description = "Update + relock flake inputs, then dry-build every host"
run = '''
set -eu
nix flake update
mise run verify
'''

[tasks."secrets:updatekeys"]
description = "Re-encrypt secrets for the current .sops.yaml recipients"
run = '''
set -eu
export SOPS_AGE_KEY_FILE="$HOME/.config/age/age.agekey"
sops updatekeys secrets/secrets.yaml
'''

[tasks.deploy]
description = "Build + activate a host's config on a REMOTE box: HOST=server TARGET=user@host mise run deploy"
run = '''
set -eu
: "${HOST:?usage: HOST=<config> TARGET=user@host mise run deploy}"
: "${TARGET:?usage: HOST=<config> TARGET=user@host mise run deploy}"
# Builds locally, copies the closure, activates on the target. Same CPU arch assumed.
nixos-rebuild switch --flake ".#$HOST" --target-host "$TARGET" --use-remote-sudo
'''

[tasks.new-host]
description = "Scaffold a new (server-flavoured) host: NAME=<name> mise run new-host"
run = '''
set -eu
: "${NAME:?usage: NAME=<hostname> mise run new-host}"
dir="hosts/$NAME"
[ -e "$dir" ] && { echo "$dir already exists — aborting"; exit 1; }
mkdir -p "$dir"

# Identity/boot — mirrors hosts/server, retargeted to $NAME.
cat > "$dir/default.nix" <<EOF
{ config, pkgs, lib, ... }:

# Headless server "$NAME". Hardware + identity only — what this host COMPOSES lives in ./spec.nix.
{
  imports = [ ./hardware-configuration.nix ];

  networking.hostName = "$NAME";

  # UEFI boot. If this box is older/BIOS, replace with:
  #   boot.loader.grub = { enable = true; device = "/dev/sda"; };
  boot.loader.systemd-boot.enable = true;
  boot.loader.efi.canTouchEfiVariables = true;
}
EOF

# Placeholder hardware config so the flake evaluates in CI before the box exists.
cat > "$dir/hardware-configuration.nix" <<'EOF'
# PLACEHOLDER — replace on the real machine:
#   mise run hardware     (run ON the box, then commit)
# This stub only exists so the flake evaluates in CI before the box is installed.
{ config, lib, pkgs, modulesPath, ... }:

{
  imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];

  boot.initrd.availableKernelModules = [ "ahci" "xhci_pci" "virtio_pci" "sd_mod" ];
  boot.initrd.kernelModules = [ ];
  boot.kernelModules = [ ];
  boot.extraModulePackages = [ ];

  fileSystems."/" = {
    device = "/dev/disk/by-uuid/00000000-0000-0000-0000-000000000000";
    fsType = "ext4";
  };

  fileSystems."/boot" = {
    device = "/dev/disk/by-uuid/0000-0000";
    fsType = "vfat";
    options = [ "fmask=0077" "dmask=0077" ];
  };

  swapDevices = [ ];

  nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
}
EOF

# The composition spec. flake.nix derives nixosConfigurations from hosts/ (readDir) and the CI
# matrix is generated from `ls hosts`, so there is NOTHING else to edit — no flake.nix entry, no
# sed into check.yaml. A host dir WITHOUT this file fails the whole flake, so it must exist.
cat > "$dir/spec.nix" <<'EOF'
# What this host composes, on top of the base every host gets from mkHost (flake.nix).
# A plain spec consumed by mkHost — NOT a NixOS module. Add ../../modules/<feature>.nix to opt in;
# for a graphical host use `graphical ++ [ ... ]` instead (see hosts/desktop/spec.nix).
{ inputs, graphical }:
{
  extraModules = [ ../../modules/server.nix ];
}
EOF

git add "$dir"
echo
echo ">> Scaffolded $dir (git-added): default.nix + spec.nix + placeholder hardware-configuration.nix"
echo ">> flake.nix and the CI matrix both discover it automatically — nothing else to edit."
echo ">> Next: mise run verify   (and on the box: mise run hardware)"
'''
