#Remap the prefix to screens
#set -g prefix C-x
#bind C-x send-prefix
set -g prefix C-a
bind C-a send-prefix

unbind C-b

# Default bar color — must be set BEFORE the nested-SSH block below, or it
# clobbers the green "you're nested" indicator during parse.
set -g status-bg blue

# Nested SSH sessions: when THIS tmux was started inside an SSH login, shift its
# prefix off C-a so it stops colliding with the outer (local) tmux. C-a drives
# the outer session, C-x the inner one — no more "C-a a" double-tap. Detected via
# $SSH_CONNECTION at server-start; recolor the bar so it's obvious which layer
# your keys land in. Sit at this box locally -> no SSH var -> plain C-a.
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g prefix C-x
    bind C-x send-prefix
    unbind C-a
    set -g status-bg green
}

# The block above only runs at SERVER start — attaching to an already-running
# server never re-reads this file, so a session that outlived its SSH login
# (or a server resurrected at boot) stays on C-a until a manual reload.
# Re-check on every client attach instead: update-environment copies
# SSH_CONNECTION from the attaching client into the session env before hooks
# fire, so this sees the CURRENT client's reality, not the server's birth env.
# Flips back to C-a/blue when a non-SSH client attaches. -g (not -ag): replace,
# so a config reload doesn't stack duplicate hooks.
# NB: \$SSH_CONNECTION must stay ESCAPED — tmux expands a bare $VAR at config-load
# time (once, while empty), freezing the test into "[ -n \"\" ]" which is always
# false and pins every attach to the C-a/blue else-branch. The backslash defers
# expansion to /bin/sh at hook-fire time, so it reads the CURRENT client's env.
set-hook -g client-attached 'if-shell "[ -n \"\$SSH_CONNECTION\" ]" "set -g prefix C-x ; bind C-x send-prefix ; unbind C-a ; set -g status-bg green" "set -g prefix C-a ; bind C-a send-prefix ; unbind C-x ; set -g status-bg blue"'

# Create new windows/panes from CWD, remap keys. The -N notes feed the
# prefix+? cheat sheet (cheatsheet.sh joins them with the real commands) —
# every custom bind in this file should carry one.
bind -N "Split pane below (keeps cwd)" '"' split-window -c "#{pane_current_path}"
bind -N "Split pane right (keeps cwd)" % split-window -h -c "#{pane_current_path}"
bind -N "New window (keeps cwd)" c new-window -c "#{pane_current_path}"

# Auto-even panes after every split (spreads current pane + neighbors evenly)
set-hook -g after-split-window "select-layout -E"

# Re-even surviving panes when one is closed
set-hook -g pane-exited "select-layout -E"
set-hook -g after-kill-pane "select-layout -E"

#Quality of life stuff
set -g history-limit 100000
set -g allow-rename on

## Join Windows
bind-key -N "Pull a pane here from another window (prompts)" j command-prompt -p "Join pane from:" "join-pane -s '%%'"
bind-key -N "Push this pane to another window (prompts)" s command-prompt -p "Send pane to:" "join-pane -t '%%'"

#Need to break the pane to send it to a active window
bind-key -N "Break this pane out into its own window" p break-pane

# Set the first window to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Closing window 2 of 4 leaves a numbering gap forever (base-index only affects
# creation); renumber keeps prefix+<digit> matching what the status bar shows.
set -g renumber-windows on

# Search Mode VI (default is emac)
set-window-option -g mode-keys vi

# vi copy mode ships with `v` as rectangle-toggle and no begin-selection on a
# letter key — remap to the vim muscle memory (v = select, C-v = block select).
# Yank itself is tmux-yank's `y`.
bind -N "Start selection (vim-style)" -T copy-mode-vi v send -X begin-selection
bind -N "Toggle block/rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle

# Make the window pretty again. Must be a tmux-*/screen-* entry (tmux upstream
# requirement) — the old xterm-256color value lied to pane apps about their
# terminal. NB: SSH targets need the tmux-256color terminfo; ancient hosts may
# complain "unknown terminal type".
set -g default-terminal "tmux-256color"

# Image previews (yazi et al) inside tmux: apps draw via kitty-graphics escapes
# that tmux must forward to the outer terminal, and they pick their protocol by
# sniffing the OUTER terminal's identity — so pass their sequences through and
# keep TERM/TERM_PROGRAM fresh on re-attach. Without these, yazi renders its
# U+10EEEE image placeholders as glyph salad and its startup terminal probe
# times out (looks like a hang/crash). Needs a full server restart to fully
# take effect, not just a reload.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# The server bakes its birth environment into every future pane. Born from a
# kitty window, that leaks kitty's identity (KITTY_*) into panes viewed from
# any other client — yazi then commits to kitty-only graphics while e.g. VS
# Code's terminal is watching (renders as placeholder garbage) — and kitty's
# TERMINFO dir (which only contains xterm-kitty) shadows the real entry for
# TERM=tmux-256color panes. Scrub them at server start; the per-client truth
# arrives via update-environment above on each attach.
set-environment -gr KITTY_WINDOW_ID
set-environment -gr KITTY_PID
set-environment -gr KITTY_PUBLIC_KEY
set-environment -gr KITTY_INSTALLATION_DIR
set-environment -gr KITTY_SHELL_INTEGRATION
set-environment -gr TERMINFO

# Change default shell
#set-option -g default-shell /bin/zsh

# Let the mouse exist again
set -g mouse on

#run-shell ~/.tmux/plugins/tmux-logging/logging.tmux

#Other useful binds
bind-key -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key -N "Edit ~/.tmux.conf in vim (right split)" M split-window -h "vim ~/.tmux.conf"

# prefix+?: fuzzy-searchable cheat sheet — every bind's -N note joined with
# its real command, in a popup. Replaces the stock ?, which shows the same
# notes but read-only in copy mode with no search.
bind -N "This cheat sheet" ? display-popup -E -w 95% -h 85% "~/.config/tmux/cheatsheet.sh"

# Floating popups (native since 3.2) — beats a plugin or a dedicated window.
# g: lazygit over the current pane's repo. C-t: a persistent "scratch" session
# in a popup; hitting C-t again from INSIDE it detaches (popup closes), and the
# session survives detach so long-running odds and ends keep going. Popup
# commands run with $TMUX unset, so the nested `tmux new-session` is safe.
bind -N "lazygit popup in this pane's repo" g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit
bind -N "Toggle scratch-session popup" C-t if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E "tmux new-session -A -s scratch"'

# Type into every pane of the window at once (fan a command out to N SSH'd
# boxes). Steals prefix+S; the status-right shows nothing, so echo the state —
# forgetting this is ON is how you paste a loop into prod twice.
bind -N "Toggle typing into ALL panes at once" S set-window-option synchronize-panes \; display-message "sync-panes: #{?pane_synchronized,ON,off}"

# Flag the window in the status bar when a quiet pane prints again — "tell me
# when that long job does something". Steals prefix+m (mark-pane; the j/s
# join binds above use prompts, not marks, so nothing here needs marking).
bind -N "Toggle activity alert for this window" m set-window-option monitor-activity \; display-message "monitor-activity: #{?monitor-activity,on,off}"

# Repeatable pane resize / window reorder (hold prefix once, tap away).
# L steals switch-client -l (last session) — session-hopping isn't the
# workflow here; one main session + popups is.
bind -r -N "Resize pane left (repeatable)" H resize-pane -L 5
bind -r -N "Resize pane down (repeatable)" J resize-pane -D 5
bind -r -N "Resize pane up (repeatable)" K resize-pane -U 5
bind -r -N "Resize pane right (repeatable)" L resize-pane -R 5
bind -r -N "Move window left in status bar" "<" swap-window -d -t -1
bind -r -N "Move window right in status bar" ">" swap-window -d -t +1

#Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'Brutuski/tmux-piavpn'
set -g @plugin 'jaclu/tmux-menus'
# prefix+Tab: fzf over every word/path/URL/hash in scrollback, then insert or
# copy it — grab tokens out of tool output without reaching for the mouse.
# (fuzzback searches for a LINE and jumps to it; extrakto extracts a TOKEN.)
set -g @plugin 'laktak/extrakto'
# Copy mode: o = xdg-open the selection (URLs, file paths), S = web-search it.
set -g @plugin 'tmux-plugins/tmux-open'

# Fuzzback's default trigger is prefix+? — and since tpm runs last, it silently
# re-steals ? from the cheat-sheet bind on every reload. C-f ("find") instead.
set -g @fuzzback-bind 'C-f'

# For the prefix highlighter
set -g @prefix_highlight_fg 'black' # default is 'colour231'
set -g @prefix_highlight_bg 'white'  # default is 'colour04'

# To highlight when Tmux prefix is picked
set -g status-left-length 20
set -g status-left '[#S] ||  #{prefix_highlight}  ||  '

# To align the status bar when the prefix isn't hit
set -g @prefix_highlight_empty_prompt '    '


# For showing load
set -g status-right "#[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --powerline-right --interval 2)#[default]"

# Window naming handled by fish shell hooks (see fishconfig.d/tmux_window_title.fish)
# This provides a default for non-fish shells
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

#Begin logging in TMUX
#run-shell /root/.tmux/plugins/tmux-logging/logging.tmux

#Initialize TMUX plugin manager (keep this at the bottom)
run -b '~/.tmux/plugins/tpm/tpm'

