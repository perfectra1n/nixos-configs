# Fully opaque on purpose — Hyprland's blur has nothing to show through at 1.0,
# which is the point. Drop to ~0.95 if you want a hint of the wallpaper back.
background_opacity 1.0
confirm_os_window_close 0

# Colorscheme (Monokai). Keep last so its colors win over any earlier setting.
include monokai.conf
