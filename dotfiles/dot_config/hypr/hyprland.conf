
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# Flake-owned fragments (GPU env, monitor layout, autostart) — written by the
# nixos-configs flake per host, NOT by chezmoi. Keep these sourced first.
source = ~/.config/hypr/gpu.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/autostart.conf

# Don't auto-convert SDR fullscreen apps to HDR. With DP-3 in HDR mode, auto-HDR
# inverse-tone-maps SDR games (e.g. Space Marine 2) into PQ range, lifting blacks
# to grey and over-brightening — but only in fullscreen. Desktop HDR stays on.
render {
    cm_auto_hdr = 0
}

# NOTE: do NOT add static `workspace = N, monitor:...` bindings — this setup uses
# hyprsome, which namespaces workspaces per monitor by monitor id (id 0 -> ws 1-10,
# id 1 -> ws 11-20). Static bindings fight that scheme; the primary monitor earns id 0
# by being on the lowest-numbered connected port instead.
# The "focus the primary at login" exec-once used to live HERE as `focusmonitor DP-1`,
# which silently no-op'd once DP-1 became a disconnected iGPU connector. It moved to the
# per-host monitors.conf fragment, where it can name the panel by `desc:` — a monitor
# identity is host-specific and has no business in this host-agnostic dotfile.

#############
### Inits ###
#############
# No Hyprland plugins right now. hyprsplit was dropped: its nixpkgs C++ build is
# broken against Hyprland 0.55 (nixpkgs#524892). Re-add via plugins.conf (Nix)
# once fixed — and never via hyprpm, which compiles at runtime and fights the
# immutable store. Workspaces are global (per-monitor split is gone until then).



##############################
###  ENVIRONMENT VARIABLES  ###
##############################
# GPU env (nvidia/amd), HDR, and the no_hardware_cursors workaround moved to the
# flake-owned gpu.conf / monitors.conf sourced at the top. Only host-agnostic
# Wayland env stays here.

env = XDG_SESSION_TYPE,wayland
env = ENABLE_GAMESCOPE_WSI,1
env = SDL_VIDEODRIVER,wayland
# Run Electron apps (Discord, VSCode, …) natively on Wayland instead of XWayland,
# so they get proper fractional scaling (sharp AND correct size) — sidesteps the
# force_zero_scaling shrink. "auto" falls back to X11 where there's no Wayland.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

################
### MONITORS ###
################
# Monitor layout + HDR render → ~/.config/hypr/monitors.conf (flake, per host).

##############
### THEMING ##
##############

env = GTK_THEME,Adwaita:dark
env = QT_STYLE_OVERRIDE,adwaita-dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = QT_STYLE_OVERRIDE,Breeze
env = XCURSOR_THEME,Posy_Cursor
env = XCURSOR_SIZE,24


# See https://wiki.hypr.land/Configuring/Monitors/
# Monitor layout lives in ~/.config/hypr/monitors.conf (flake-owned, per host).
# input {} and decoration {} are defined once below (### INPUT ### / ### LOOK AND FEEL ###).

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin  # KDE/Qt. Installed via home/gui.nix along with kio-extras (Trash/network) and
                        # ark (archive context menu). Nautilus stays installed as the GTK fallback.
$menu = rofi -show drun

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 4   # komorebi border_width

    # Hyprland default border colors (restored from the komorebi blue/grey override):
    # active = cyan→green 45° gradient, inactive = translucent grey.
    #col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on.
    # Tearing vs VRR are alternative latency strategies — for the 240Hz G-Sync OLED prefer
    # VRR (misc:vrr) and leave this false. Set true only if you choose the tearing path
    # instead (then also uncomment the gamescope `immediate` windowrule below).
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # `pseudotile` option removed in Hyprland 0.55 — toggle per-window via the
    # `pseudo` dispatcher (bound to mainMod + P below).
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# Groups = komorebi-style stacks (tabbed). COLORS are owned by DMS — ./dms/colors.conf
# is sourced near the bottom and sets every group col.* to the live $primary, so any
# col.* set HERE is dead (overridden). A komorebi-green accent is layered back on AFTER
# that source at the end of this file (same trick as the active border). So this block
# carries only the NON-color STYLE of the tab bar.
group {
    groupbar {
        enabled = true
        font_family = FiraCode Nerd Font
        font_size = 12              # a touch bigger so tab titles are easy to read
        height = 24                  # ~komorebi stackbar height
        indicator_height = 3         # thin accent strip under the active tab
        gradients = true             # filled, rounded tabs (vs the flat indicator lines)
        rounding = 8
        gradient_rounding = 8
        round_only_edges = true      # round the bar's outer ends, not every tab seam
        gaps_in = 3                  # gap between tabs
        gaps_out = 4                 # gap around the whole bar
        keep_upper_gap = true
        text_color = rgb(ffffff)
        render_titles = true
        scrolling = true             # scroll over the bar to cycle tabs
    }
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    # VRR / G-Sync for the 240Hz OLED. 2 = fullscreen-only (safest on NVIDIA — avoids the
    # desktop/app flicker that always-on `vrr = 1` can cause). Uncomment to enable, then
    # verify with `hyprctl monitors` (vrr: 1 while a fullscreen game is up). Keep tearing
    # off when using VRR (see general:allow_tearing + the gamescope `immediate` rule).
    vrr = 2
}

# XWayland apps (Steam, Discord, …) can't use Wayland fractional scaling, so on a
# fractionally-scaled display (Olgierd @ 1.25) Hyprland upscales their buffer →
# blurry / low-res UI. Force them to render at scale 1 so they're sharp. They'll
# render ~20% smaller on the 1.25 panel; bump per-app zoom if needed (Steam: UI
# scaling in settings; Discord: Ctrl+=). No effect on scale-1 hosts (Vesemir).
xwayland {
    force_zero_scaling = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    # These scroll configs emulate windows the closest
    kb_layout = us
    # Useless
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
}

# Gestures: the `gestures {}` block was removed in Hyprland 0.55 (replaced by the
# `gesture =` keyword / hl.gesture). Workspace swipe was off, so nothing to migrate.

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# ── VM keyboard passthrough ────────────────────────────────────────────────
# Wayland compositors own the global keybinds, so VMware/VirtualBox guests don't
# see Super/workspace shortcuts the way they do under i3. Ctrl+Alt toggles a
# passthrough submap in which Hyprland ignores ALL of its binds and every key
# reaches the guest (Ctrl+Alt mirrors VMware's own input-release chord). Press it
# again to exit. waybar's hyprland/submap module shows when passthrough is active.
bind = CTRL, Alt_L, submap, passthrough
submap = passthrough
bind = CTRL, Alt_L, submap, reset
submap = reset
# ───────────────────────────────────────────────────────────────────────────

# Layout toggles
# NOTE: these use `bindd` (the description variant: MODS, KEY, <description>, dispatcher, args).
# Hyprland surfaces that description in `hyprctl binds -j`, which is what hypr-cheatsheet
# (Super+/) reads — so the human-readable text below IS the cheatsheet entry. Keep it short.
bindd = $mainMod, Return, Open terminal, exec, $terminal
#Managed by DMS now - bind = ALT, Space, exec, pkill rofi || rofi -show drun
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, E, Open file manager, exec, $fileManager
bindd = $mainMod SHIFT, Space, Toggle floating, togglefloating,
bindd = $mainMod, P, Pseudotile (dwindle), pseudo,
bindd = $mainMod, slash, Show this keybind cheatsheet, exec, hypr-cheatsheet
# Flip the split orientation of the focused dwindle pair (i3 split h / split v).
# Super+V is DMS's clipboard, so this lives on Super+T. In Hyprland 0.55 the dwindle
# layout commands moved behind the `layoutmsg` dispatcher (bare `togglesplit` is gone).
bindd = $mainMod, T, Toggle split direction (dwindle), layoutmsg, togglesplit
# swapsplit swaps which window occupies the first vs second half of the focused
# dwindle split — i.e. the two tiles trade places WITHOUT changing the split's
# orientation (unlike Super+T, which rotates side-by-side <-> stacked but keeps each
# window's slot). Use it when the layout shape is right but the windows are on the
# wrong sides. Acts only on the focused split node, so with 3+ windows it swaps the
# pair under the focus, not the whole tree.
bindd = $mainMod SHIFT, T, Swap the two halves of the split (dwindle), layoutmsg, swapsplit
bindd = $mainMod, F, Maximize within work area (monocle), fullscreen, 1
bindd = $mainMod SHIFT, F, True edge-to-edge fullscreen (games), fullscreen, 0
bindd = $mainMod, G, Stack ALL windows in workspace (toggle), exec, ~/.config/hypr/stack-all.sh

# Window groups (tabbed stacks):
#   Super+W        — toggle the FOCUSED window into / out of its own group. This is
#                    the "start a stack" primitive: make a 1-tab group here, then
#                    merge neighbours with Super+Alt+arrow (stack-push.sh, below —
#                    works whether the stack or the loose window is focused).
#                    Super+G stacks the WHOLE workspace.
#   Super+Shift+G  — lock the active group (toggle), so Super+Alt+arrow stops
#                    merging more windows in by accident.
#   MOVE vs. MERGE — Super+Shift+arrow MOVES the window (or the whole stack, since a
#                    stack is one tile) and never merges; Super+Alt+arrow MERGES into
#                    a stack. Tab cycling: Super+Tab / Super+[ ];  Super+Shift+W pops out.
bindd = $mainMod, W, Toggle window into/out of a stack, togglegroup
bindd = $mainMod SHIFT, G, Lock active stack, lockactivegroup, toggle
bindd = $mainMod SHIFT, W, Pop window out of stack, moveoutofgroup
bindd = $mainMod, Tab, Next tab in stack, changegroupactive, f
bindd = $mainMod SHIFT, Tab, Previous tab in stack, changegroupactive, b
# Merge INTO a stack (build it) — Super+Alt+arrow via stack-push.sh, which merges in
# BOTH directions: push a loose window INTO a stack, OR push a focused STACK onto its
# loose neighbour (Hyprland's bare movewindoworgroup only does the former; see script).
# This is the "grow the stack" key; Super+Shift+arrow (below) is the "move it" key.
bindd = $mainMod ALT, left,  Merge window into stack (left),  exec, ~/.config/hypr/stack-push.sh l
bindd = $mainMod ALT, down,  Merge window into stack (down),  exec, ~/.config/hypr/stack-push.sh d
bindd = $mainMod ALT, up,    Merge window into stack (up),    exec, ~/.config/hypr/stack-push.sh u
bindd = $mainMod ALT, right, Merge window into stack (right), exec, ~/.config/hypr/stack-push.sh r
# Bracket keys = step left/right through the stack (komorebi-style).
bindd = $mainMod, bracketleft,  Previous tab in stack, changegroupactive, b
bindd = $mainMod, bracketright, Next tab in stack, changegroupactive, f


# Move windows / whole stacks (arrow keys) — plain movewindow. A stack is a single
# tile, so this relocates the ENTIRE stack as a block; a loose window just moves. It
# never merges into a group (that's Super+Alt+arrow) — move vs. merge are split so the
# i3/sway muscle memory (Super+Shift+arrow = move) holds for stacks too.
bindd = $mainMod SHIFT, left,  Move window / stack left,  movewindow, l
bindd = $mainMod SHIFT, down,  Move window / stack down,  movewindow, d
bindd = $mainMod SHIFT, up,    Move window / stack up,    movewindow, u
bindd = $mainMod SHIFT, right, Move window / stack right, movewindow, r

# Focus movement (arrow keys)
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, down, Focus down, movefocus, d
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, right, Focus right, movefocus, r

# Swap the focused tile with its neighbour — positions trade places (i3 "move"
# between tiles, komorebi swap). All four arrow combos are taken (focus / move /
# tab-cycle / resize), so swap lives on Super+Ctrl+Shift+arrows.
bindd = $mainMod CTRL SHIFT, left,  Swap tile left, swapwindow, l
bindd = $mainMod CTRL SHIFT, down,  Swap tile down, swapwindow, d
bindd = $mainMod CTRL SHIFT, up,    Swap tile up, swapwindow, u
bindd = $mainMod CTRL SHIFT, right, Swap tile right, swapwindow, r

# Multi-monitor (komorebi focus-monitor / move-to-monitor). comma = left, period =
# right for focus + send-window; Ctrl moves the WHOLE workspace to the other display
# (relative ±1, which on a 2-monitor setup is just "the other one").
bindd = $mainMod, comma,  Focus monitor left, focusmonitor, l
bindd = $mainMod, period, Focus monitor right, focusmonitor, r
bindd = $mainMod SHIFT, comma,  Move window to left monitor, movewindow, mon:l
bindd = $mainMod SHIFT, period, Move window to right monitor, movewindow, mon:r
bindd = $mainMod CTRL, comma,  Move workspace to other monitor, movecurrentworkspacetomonitor, -1
bindd = $mainMod CTRL, period, Move workspace to other monitor, movecurrentworkspacetomonitor, +1

# Floating helpers + quick navigation
bindd = $mainMod, C, Center floating window, centerwindow,
bindd = $mainMod SHIFT, P, Pin floating window (all workspaces), pin,
bindd = $mainMod, Z, Focus last window (toggle), focuscurrentorlast,
bindd = $mainMod, Backspace, Workspace back-and-forth, workspace, previous

# Scratchpad — Hyprland "special" workspace (i3 scratchpad). Super+minus shows/hides
# it; Super+Shift+minus stashes the focused window into it.
bindd = $mainMod, minus, Toggle scratchpad, togglespecialworkspace, scratch
bindd = $mainMod SHIFT, minus, Move window to scratchpad, movetoworkspacesilent, special:scratch

# Alt+Tab window switching is handled by the hyprshell daemon (exec-once = hyprshell run,
# in the flake's autostart.conf), which registers the Alt+Tab key itself from
# ~/.config/hyprshell/config.ron — so there are no Alt+Tab binds here.

# Switch workspaces per-monitor (hyprsome acts on the focused monitor's set)
bindd = $mainMod, 1, Workspace 1 (this monitor), exec, hyprsome workspace 1
bindd = $mainMod, 2, Workspace 2 (this monitor), exec, hyprsome workspace 2
bindd = $mainMod, 3, Workspace 3 (this monitor), exec, hyprsome workspace 3
bindd = $mainMod, 4, Workspace 4 (this monitor), exec, hyprsome workspace 4
bindd = $mainMod, 5, Workspace 5 (this monitor), exec, hyprsome workspace 5
bindd = $mainMod, 6, Workspace 6 (this monitor), exec, hyprsome workspace 6
bindd = $mainMod, 7, Workspace 7 (this monitor), exec, hyprsome workspace 7
bindd = $mainMod, 8, Workspace 8 (this monitor), exec, hyprsome workspace 8
bindd = $mainMod, 9, Workspace 9 (this monitor), exec, hyprsome workspace 9

# Move active window to workspace N on the focused monitor (hyprsome)
bindd = $mainMod SHIFT, 1, Move window → workspace 1, exec, hyprsome move 1
bindd = $mainMod SHIFT, 2, Move window → workspace 2, exec, hyprsome move 2
bindd = $mainMod SHIFT, 3, Move window → workspace 3, exec, hyprsome move 3
bindd = $mainMod SHIFT, 4, Move window → workspace 4, exec, hyprsome move 4
bindd = $mainMod SHIFT, 5, Move window → workspace 5, exec, hyprsome move 5
bindd = $mainMod SHIFT, 6, Move window → workspace 6, exec, hyprsome move 6
bindd = $mainMod SHIFT, 7, Move window → workspace 7, exec, hyprsome move 7
bindd = $mainMod SHIFT, 8, Move window → workspace 8, exec, hyprsome move 8
bindd = $mainMod SHIFT, 9, Move window → workspace 9, exec, hyprsome move 9

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Next workspace (scroll), workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace (scroll), workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Drag to move window, movewindow
binddm = $mainMod, mouse:273, Drag to resize window, resizewindow

# Resize the FOCUSED window from the keyboard — grow one window so it takes more
# area (dwindle shrinks its neighbours to fit). This is true tiling resize, NOT the
# cursor zoom/magnify. Quick nudge: hold Super+Ctrl and tap arrows (held = repeat).
bindde = $mainMod CTRL, left,  Resize window left, resizeactive, -60 0
bindde = $mainMod CTRL, right, Resize window right, resizeactive, 60 0
bindde = $mainMod CTRL, up,    Resize window up, resizeactive, 0 -60
bindde = $mainMod CTRL, down,  Resize window down, resizeactive, 0 60

# Sustained resize mode for big changes: Super+R, then just the arrows (held =
# repeat), Esc/Enter to exit — no need to hold three keys the whole time.
bindd = $mainMod, R, Resize mode (then arrows), submap, resize
submap = resize
binde = , left,  resizeactive, -60 0
binde = , right, resizeactive, 60 0
binde = , up,    resizeactive, 0 -60
binde = , down,  resizeactive, 0 60
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lockscreen and timeouts
# Auto-lock and screen management
bindd = $mainMod, L, Lock screen, exec, dms ipc lock lock
# Log out — exits Hyprland back to the tuigreet login screen. No confirmation, so
# unsaved work is lost (same as the existing Super+M = exit bind).
bindd = $mainMod SHIFT, L, Log out of Hyprland, exit


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float on, match:class ^(kitty)$, match:title ^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Orange border on fullscreen/maximized windows (e.g. the Super+F monocle) as a visual
# cue. Shows on maximize (fullscreen mode 1, which keeps the border); a true edge-to-edge
# fullscreen (mode 0) draws no border, so it won't appear there.
windowrule = border_color rgb(FFA500), match:fullscreen true

# Quake/dropdown terminal — pyprland handles float/size/animation (see config.toml).
bindd = $mainMod, grave, Dropdown terminal (toggle), exec, pypr toggle term

# Gamescope setup
# `immediate on` (tearing) only takes effect with general:allow_tearing = true, and
# tearing conflicts with VRR. Reconciled toward the VRR path → left commented out.
# Uncomment this (and set allow_tearing = true) only if you pick tearing over VRR.
# windowrule = immediate on, match:class ^(gamescope)$
windowrule = fullscreen on, match:class ^(gamescope)$
windowrule = float on, match:class ^(gamescope)$

# flameshot region-selection overlay — matched by TITLE (the window has an empty class). Float it
# so Hyprland doesn't tile the overlay into a workspace slot (which shrinks it and breaks the
# full-screen region pick). Created by `flameshot gui` (PrintScreen).
windowrule = float on, match:title ^(flameshot)$

# War Thunder — force TRUE fullscreen (mode 0) so it covers the dms:bar's 44px
# reserved zone. Hyprland's maximize (mode 1) avoids that zone -> bar stays; only
# mode-0 fullscreen ignores it. Matched by TITLE (most reliable) AND likely class.
# If WT still TILES as a half-window, the match is wrong: run
#   hyprctl clients | grep -iE 'class:|title:'
# while WT is up and fix the regex. Manual fallback works regardless: SUPER+SHIFT+F.
windowrule = fullscreen on, match:title ^(War Thunder.*)$
windowrule = fullscreen on, match:class ^(aces|aces\.exe)$
windowrule = no_anim on, match:title ^(War Thunder.*)$
windowrule = idle_inhibit always, match:title ^(War Thunder.*)$
windowrule = idle_inhibit always, match:class ^(aces|aces\.exe)$

###################
### Screenshots ###
###################
# flameshot is the sole screenshot tool now (replaced satty + screenshot-hdr.sh). Its tray daemon is
# autostarted by the flake (autostart.conf: exec-once = flameshot) and the grim portal is wrapped
# `-l 0` (modules/hyprland.nix) so the selector opens in ~300ms instead of ~6s.
# Bind the physical PrintScreen keycode (XKB <PRSC> = 107), NOT the PRINT keysym: on the us layout
# the key carries symbols [Print, Sys_Req], so a modifier (Shift) would resolve to the level-2
# keysym Sys_Req and a keysym bind would miss. code:107 is immune to the shift level.
# screenshot-flameshot.sh wraps `flameshot gui --raw`: keeps a local copy + clipboard, and
# best-effort mirrors into the Nextcloud VFS by month (skips cleanly when /mnt isn't mounted).
bindd = , code:107, Screenshot (flameshot), exec, ~/.config/hypr/screenshot-flameshot.sh

# HDR screencopy is broken upstream (Hyprland #11294 regression): with DP-1 (the AW3225QF QD-OLED)
# in HDR mode, screencopy (grim/flameshot/OBS/hyprpicker) wedges — stale, frozen, or blank. No
# keep_unmodified_copy value is clean: =2 freezes the HDR monitor; =1 (force the FP16 copy on ALL
# monitors) stales the SDR monitor (DP-2); =0 fixes the freeze/stale everywhere but blanks
# FULLSCREEN HDR GAME captures. No in-session refresh re-inits the wedged FP16 pipeline — only a
# real HDR mode-set does. DECISION: =0 is the daily baseline (desktop + windows capture reliably on
# both monitors). For fullscreen HDR games use Steam's F12 (the Steam overlay bypasses
# wlr-screencopy) or hdr-toggle.sh (Super+Shift+B). https://github.com/hyprwm/Hyprland/pull/11294
render:keep_unmodified_copy = 0
render:use_shader_blur_blend = 1

# Separately, grim & the screencast portal STILL can't read the HDR primary for SCREEN-SHARING
# (black share). Flip HDR off before sharing, then back on. See hdr-toggle.sh.
bindd = $mainMod SHIFT, B, Toggle HDR on this monitor, exec, ~/.config/hypr/hdr-toggle.sh

# Blank/unblank all monitors ("screensaver"): Super+B powers the panels off; press Super+B
# AGAIN to turn them back on. Input doesn't reliably wake DPMS here (NVIDIA), so it's a
# toggle you hit blind rather than relying on mouse/key wake.
bindd = $mainMod, B, Toggle monitors off/on (DPMS), exec, hyprctl dispatch dpms toggle


#########################
### Clipboard Manager ###
### Manged by DMS now ###
#########################
#windowrule = float on, match:class (com.github.hluk.copyq)
#windowrule = size 10% 20%, match:class (com.github.hluk.copyq)
# Cursor-anchoring is handled by the copyq-cursor.sh wrapper (the Super+V bind above), NOT
# a windowrule: CopyQ reuses one persistent window, so a `move cursor` rule only fires on
# the first map and never on toggle (leaving it centered on the focused monitor). The
# script shows it, then moves it to the cursor with a movewindowpixel dispatch.
source = ./dms/binds.conf
source = ./dms/colors.conf
# Active window border: DMS's live $primary (matugen, tracks the theme) + green, 45° gradient.
# Colon form + placed AFTER `source = ./dms/colors.conf` (line above) so $primary is defined —
# the general{} block (~line 90) is parsed before that source, so it can't reference $primary.
general:col.active_border = $primary rgba(00ff99ee) 45deg
# Stacks get a distinct komorebi-green accent so a focused GROUP reads differently from
# a focused normal window (DMS would otherwise paint both plain $primary). Same
# after-the-source placement as the line above, so $primary is already defined.
group:col.border_active = rgb(00A542)                       # solid green = "this is a stack"
# Groupbar tabs: FLAT solid fills (the old `$primary … 45deg` gradient blended the theme
# colour into neon green diagonally — loud, and white text was unreadable over the bright
# end). Now: active tab = the komorebi green (matches the border), other tabs = dim nord0
# so they recede, and a red active tab while the group is LOCKED (Super+Shift+G) for feedback.
group:groupbar:col.active          = rgb(00A542)            # focused tab
group:groupbar:col.inactive        = rgba(2e3440cc)         # other tabs, dimmed
group:groupbar:col.locked_active   = rgb(bf616a)            # focused tab when the stack is locked
group:groupbar:col.locked_inactive = rgba(2e3440cc)

