---
name: Renovate

# Self-hosted Renovate run (the Mend cloud app can't run our postUpgradeTasks — allowed
# commands are a self-hosted-only option, and we need `nvfetcher` + `nix flake update`).
# Needs Nix on PATH for two reasons: the flake-inputs.txt custom manager tracks each flake
# input's branch HEAD (git-refs) and re-locks it individually via `nix flake update <input>`
# as a postUpgradeTask (one PR per input — the native `nix` manager can't, it only does
# version/tag lookups, never branch-HEAD digests), and the nvfetcher.toml custom managers
# shell out to `nvfetcher` to refill _sources hashes. Both `renovate` and `nvfetcher` come
# from nixpkgs via `nix shell` below; `nix` itself is on PATH from the installer above
# (used by the flake-inputs postUpgradeTask). flake-inputs.txt is generated by
# scripts/gen-flake-input-pins.sh — see renovate.json.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — this cron is the ONLY cadence gate; renovate.json
                        # rules carry no `schedule:` so a manual workflow_dispatch opens PRs any day.
  workflow_dispatch: # manual trigger for the first run / debugging
    inputs:
      logLevel:
        description: Renovate log level
        default: debug
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # don't kill a run mid-PR-creation

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Exchange the GitHub App's ID + private key for a short-lived installation
      # token. An app token (like a PAT, unlike the workflow GITHUB_TOKEN) opens PRs
      # that still trigger other workflows, so check.yaml runs on Renovate PRs.
      # Caveat: installation tokens expire after 1h — if a run ever outlasts that
      # (many PRs × nix postUpgradeTasks), split the run or fall back to a PAT.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        env:
          # Platform defaults to github; no endpoint needed. Renovate detects the app
          # token and resolves the bot username/gitAuthor (<app>[bot]) automatically.
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: '["perfectra1n/nixos-configs"]'
          # global-only option: permits the two postUpgradeTasks in renovate.json to run —
          # `nvfetcher` (nvfetcher.toml) and the per-input flake.lock re-lock `nix flake update <input>`.
          RENOVATE_ALLOWED_COMMANDS: '["^nvfetcher$", "^nix flake update [a-z0-9-]+$"]'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        # nix shell puts BOTH renovate and nvfetcher on PATH for the run; renovate then
        # finds `nvfetcher` when it executes the postUpgradeTask.
        run: |
          nix shell nixpkgs#renovate nixpkgs#nvfetcher --command renovate
