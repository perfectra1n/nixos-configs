---
name: Check

# Gates Renovate's flake.lock PRs (and direct pushes): evaluates + plans the build
# of every host. Catches the breakage lock bumps cause — renamed/removed packages,
# changed options — without realizing the (large) closures. Mark this required in
# branch protection so Renovate's platformAutomerge waits for it.
# Also verifies the committed manifests/ inventories match the evaluated closure —
# `mise run verify` keeps them fresh locally; Renovate's postUpgradeTasks do on bump PRs.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosts:
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, laptop, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build-plan ${{ matrix.host }}
        # --dry-run does full module evaluation + closure resolution (catches eval
        # errors, removed attrs, broken/insecure pkgs) but doesn't realize the build.
        # Swap to a plain `nix build` if you add a binary cache + a beefy runner.
        run: |
          nix build --dry-run \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Manifest freshness (${{ matrix.host }})
        # gen-manifests reuses the eval the dry-run above already did (same installable →
        # warm eval cache + instantiated drvs). A diff means the closure changed without
        # regenerating manifests/ — `mise run verify` does it automatically.
        run: |
          nix run .#gen-manifests -- ${{ matrix.host }}
          git diff --exit-code -- "manifests/${{ matrix.host }}.txt" || {
            echo "::error::manifests/${{ matrix.host }}.txt is stale — run 'mise run verify' on a Nix machine and commit the result"
            exit 1
          }
