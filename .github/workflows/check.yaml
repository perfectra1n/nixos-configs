---
name: Check

# Gates Renovate's flake.lock PRs (and direct pushes): evaluates + plans the build
# of every host. Catches the breakage lock bumps cause — renamed/removed packages,
# changed options — without realizing the (large) closures. Mark this required in
# branch protection so Renovate's platformAutomerge waits for it.
# Also verifies the committed manifests/ inventories match the evaluated closure —
# `mise run verify` keeps them fresh locally; Renovate's postUpgradeTasks do on bump PRs.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE sticky comment per PR: which packages changed version, per host — rendered from the
  # manifests/*.txt diff already in the PR (no nix, no eval; ~seconds). Marker-tagged so
  # reruns edit the same comment. Skipped for fork PRs (their token can't write comments).
  manifest-comment:
    name: PR package-diff comment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit for the three-dot diff below

      - name: Render + upsert sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          git diff "$BASE"...HEAD -- 'manifests/*.txt' \
            | python3 scripts/manifest-pr-comment.py > body.md
          marker='<!-- manifest-diff-comment -->'
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@body.md >/dev/null
            echo "updated comment $cid"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
            echo "created comment"
          fi

  # The host list comes from hosts/ — the same directory flake.nix now derives nixosConfigurations
  # from (readDir) — so adding a host needs no CI edit. Deliberately NOT `nix eval`: evaluating a
  # flake output first fetches every locked input (~307 MB: nixpkgs, dms, hyprswitch, …) plus a Nix
  # install, just to print three strings — and `builtins.attrNames` validates nothing that the
  # per-host jobs below don't already catch.
  discover:
    name: Discover hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List hosts
        id: list
        run: echo "hosts=$(ls -1 hosts | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  hosts:
    # Keep `name: ${{ matrix.host }}` — the per-host check names stay desktop/laptop/server, so the
    # branch-protection required checks keep matching. A NEW host still has to be added to that
    # required list by hand; this only automates the matrix.
    name: ${{ matrix.host }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build-plan ${{ matrix.host }}
        # --dry-run does full module evaluation + closure resolution (catches eval
        # errors, removed attrs, broken/insecure pkgs) but doesn't realize the build.
        # Swap to a plain `nix build` if you add a binary cache + a beefy runner.
        # Keep the plan text: to print `will be built:` nix has to ask the substituters
        # about every path, so that section is a free cache-coverage report — consumed
        # by the next step. The runner's store starts empty, which is what makes the
        # list complete; on a machine with a warm store it silently omits what's local.
        run: |
          set -o pipefail
          nix build --dry-run \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            2>&1 | tee /tmp/head-plan.txt

      # ADVISORY (never fails the job): which packages will COMPILE locally that the base
      # commit fetched from the cache. The step above proves the host EVALUATES; it never
      # enters a builder, so a package that evaluates but fails to compile walks straight
      # through — nixpkgs shipped glaze 8.0.0 on 2026-08-04 while Hyprland 0.56.1 pins
      # `find_package(glaze 7...<8)`, hyprland stopped building, and this workflow was green.
      # Anything Hydra failed is unsubstitutable and therefore lands in `will be built:`,
      # so diffing against base surfaces it. The diff is what makes it readable: the raw
      # head-side list is ~900 entries, nearly all this repo's own permanently-uncached
      # derivations (FHS envs, wrappers, unfree), and they cancel out against base.
      # Advisory on purpose — a new entry equally means Hydra hasn't caught up yet, and
      # nothing here can tell that apart from a real breakage. A human reads every PR.
      - name: Cache coverage vs base (${{ matrix.host }})
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOST: ${{ matrix.host }}
        run: |
          set -o pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          # path:, not the git fetcher — a detached worktree's .git is a *file*, and path:
          # evaluates what's on disk, so the base resolves against its OWN flake.lock.
          nix build --dry-run \
            "path:/tmp/base#nixosConfigurations.$HOST.config.system.build.toplevel" \
            2>&1 | tee /tmp/base-plan.txt || true
          python3 scripts/uncached-delta.py \
            --base /tmp/base-plan.txt --head /tmp/head-plan.txt \
            --host "$HOST" --names-out /tmp/delta.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/delta.txt ]; then
            echo "::warning title=New from-source builds ($HOST)::$(cat /tmp/delta.txt)"
          fi

      - name: Manifest freshness (${{ matrix.host }})
        # gen-manifests reuses the eval the dry-run above already did (same installable →
        # warm eval cache + instantiated drvs). A diff means the closure changed without
        # regenerating manifests/ — `mise run verify` does it automatically.
        run: |
          nix run .#gen-manifests -- ${{ matrix.host }}
          git diff --exit-code -- "manifests/${{ matrix.host }}.txt" || {
            echo "::error::manifests/${{ matrix.host }}.txt is stale — run 'mise run verify' on a Nix machine and commit the result"
            exit 1
          }
